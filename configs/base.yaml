project:
  seed: 42

data:
  symbols: [BTCUSDT, ETHUSDT]
  interval: 1h
  start: "2021-01-01"
  end: "2025-12-31"
  timezone: UTC

costs:
  fee_slippage_per_side: 0.0015   # 0.15% per transaction (PS requirement)

execution:
  signal_at: close
  fill_at: next_open
  allow_short: false
  initial_capital: 10000

splits:
  train: ["2021-01-01", "2023-12-31"]
  validation: ["2024-01-01", "2024-12-31"]
  test: ["2025-01-01", "2025-12-31"]

  
labels:
  horizon: 24      # bars (hours) the trade can stay open
  k_up: 3.0        # take-profit = k_up * ATR% above entry
  k_dn: 3.0        # stop-loss   = k_dn * ATR% below entry
  atr_n: 14